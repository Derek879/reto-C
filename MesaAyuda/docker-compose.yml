# Levanta SQL Server, la API y el frontend: docker compose up --build
# Frontend: http://localhost:4200  ·  Swagger: http://localhost:5030/swagger
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Taller#2026Local"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Taller#2026Local' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10

  api:
    build: ./backend
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__SqlServer: "Server=sqlserver;Database=MesaAyuda;User Id=sa;Password=Taller#2026Local;TrustServerCertificate=True"
      Database__MigrarAlIniciar: "true"
      Database__DatosDeEjemplo: "true"
    ports:
      - "5030:8080"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "4200:80"
