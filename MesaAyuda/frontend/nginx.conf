server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # La API se sirve desde el mismo origen: el navegador no necesita CORS
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Rutas de Angular (/tickets/5, /indicadores...) devuelven index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
